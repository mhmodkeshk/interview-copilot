      try{ document.execCommand("copy"); toast("اتنسخ ✓"); }catch(e){ toast("مش قادر أنسخ"); }
      ta.remove();
    }
  }
  function tts(text){
    if (!("speechSynthesis" in window)) return toast("المتصفح لا يدعم النطق");
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/…/g,""));
    u.lang = "de-DE"; u.rate = .93;
    var v = (window.speechSynthesis.getVoices()||[]).filter(function(x){ return /^de/i.test(x.lang); })[0];
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
    toast(v ? "بنطق: " + v.name : "بنطق ألماني (صوت النظام)");
  }
  function fmtSize(b){
    if (!b) return "";
    if (b < 1024) return b + " B";
    if (b < 1048576) return Math.round(b/1024) + " KB";
    return (b/1048576).toFixed(1) + " MB";
  }
  function applyFs(){ document.documentElement.style.setProperty("--fs", S.fs + "px"); }
  applyFs();

  /* ============================================================
     SIDEBAR
     ============================================================ */
  function renderFilters(){
    var f = $("#filters"); f.innerHTML = "";
    function mk(id, label){
      var b = el("button","fchip"+(S.filter===id?" on":""),label);
      b.onclick = function(){ S.filter = id; renderFilters(); renderList(); };
      f.appendChild(b);
    }
    mk("all","الكل");
    mk("star","★ المثبتة");
    CATS.forEach(function(c){ mk(c.id, c.label); });
  }

  function renderList(){
    var box = $("#qlist"); box.innerHTML = "";
    var terms = norm(S.q).split(" ").filter(Boolean);

    var items = DB.questions.filter(function(q){
      if (S.filter === "star" && S.stars.indexOf(q.id) === -1) return false;
      if (S.filter !== "all" && S.filter !== "star" && q.cat !== S.filter) return false;
      if (!terms.length) return true;
      var h = norm([q.q_ar,q.q_de,q.kurz,q.ar,(q.tags||[]).join(" ")].join(" "));
      return terms.every(function(t){ return h.indexOf(t) !== -1; });
    });

    if (!items.length){
      box.appendChild(el("div","placeholder","مفيش نتايج…\nجرّب كلمة تانية"));
      return;
    }

    var grid = el("div","qgrid");
    items.forEach(function(q){
      var b = el("button","tile" + (q.id===S.id?" on":"") + (q.audio?" has-audio":""));
      b.title = (q.q_de || "") + " — " + (q.q_ar || "");
      b.appendChild(el("span","num", String(DB.questions.indexOf(q)+1)));
      var txb = el("span","tx");
      var de = el("span","de", q.q_de || q.q_ar);
      if (q.q_de) de.setAttribute("dir","ltr");
      txb.appendChild(de);
      if (q.q_de && q.q_ar) txb.appendChild(el("span","ar", q.q_ar));
      b.appendChild(txb);
      if (S.stars.indexOf(q.id) !== -1) b.appendChild(el("span","st","★"));
      b.appendChild(el("span","spk", q.audio ? "🔊" : ""));
      b.onclick = function(){ selectQuestion(q.id); };
      grid.appendChild(b);
    });
    box.appendChild(grid);

    var act = box.querySelector(".tile.on");
    if (act && act.scrollIntoView){
      try { act.scrollIntoView({block:"nearest"}); } catch(e){}
    }
  }

  /* ============================================================
     ANSWER PANEL
     ============================================================ */
  var currentTab = "kurz";
  var audioEl = new Audio();
  var audioURL = null;
  var loadedFor = null;
  var pendingAudio = null;   /* {blob, name, size, type} */
  var editingId = null;

  function currentQ(){ 
    for (var i=0;i<DB.questions.length;i++) if (DB.questions[i].id===S.id) return DB.questions[i];
    return null;
  }

  function selectQuestion(id){
    S.id = id;
    document.body.classList.add("answering");
    savePref();
    renderList();
    renderAnswer();
    var m = $(".main"); if (m) m.scrollTop = 0;
  }

  function renderAnswer(){
    var wrap = $("#answerWrap");
    wrap.innerHTML = "";
    var q = currentQ();

    if (!q){
      var ph = el("div","placeholder");
      var big = el("span","big","🎧"); ph.appendChild(big);
      ph.appendChild(document.createTextNode("اختار سؤال من القايمة على الشمال"));
      wrap.appendChild(ph);
      return;
    }

    /* ---- head ---- */
    var head = el("div","anshead");
    var qb = el("div","qblock");
    var qde = el("div","qde", q.q_de || q.q_ar);
    if (q.q_de) qde.setAttribute("dir","ltr");
    qb.appendChild(qde);
    if (q.q_de && q.q_ar) qb.appendChild(el("div","qar", q.q_ar));
    head.appendChild(qb);

    var acts = el("div","qacts");
    var bBack = el("button","ibtn", "→"); bBack.title = "رجوع للقايمة";
    bBack.onclick = function(){ document.body.classList.remove("answering"); };
    if (window.innerWidth <= 860) acts.appendChild(bBack);

    var bStar = el("button","ibtn" + (S.stars.indexOf(q.id)!==-1?" gold":""), S.stars.indexOf(q.id)!==-1?"★":"☆");
    bStar.title = "تثبيت";
    bStar.onclick = function(){
      var i = S.stars.indexOf(q.id);
      if (i===-1) S.stars.push(q.id); else S.stars.splice(i,1);
      savePref(); renderAnswer(); renderList();
    };
    acts.appendChild(bStar);

    var bEdit = el("button","ibtn","✏️"); bEdit.title = "تعديل";
    bEdit.onclick = function(){ openEditor(q.id); };
    acts.appendChild(bEdit);
    head.appendChild(acts);
    wrap.appendChild(head);

    /* ---- player ---- */
    wrap.appendChild(buildPlayer(q));

    /* ---- tabs ---- */
    var tabs = el("div","tabs");
    [["kurz","مختصر · 20 ثانية"],["lang","النص الكامل"],["ar","المعنى بالعربي"]].forEach(function(t){
      var b = el("button","tab"+(currentTab===t[0]?" on":""), t[1]);
      b.onclick = function(){ currentTab = t[0]; renderAnswer(); };
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);

    /* ---- content ---- */
    var body = el("div","sec" + (S.practice ? " blurred" : ""));
    var label = currentTab==="ar" ? "المعنى بالعربي" : (currentTab==="lang" ? "النص الكامل" : "الإجابة المختصرة");
    body.appendChild(el("div","lbl", label));

    var text = currentTab==="ar" ? (q.ar || "—") : (currentTab==="lang" ? (q.lang || q.kurz || "") : (q.kurz || ""));
    var tx = el("div","txt " + (currentTab==="ar" ? "ar" : "de"), text);
    if (currentTab!=="ar") tx.setAttribute("dir","ltr");
    body.appendChild(tx);

    var tools = el("div","row");
    tools.style.cssText = "display:flex;gap:7px;margin-top:11px;flex-wrap:wrap";
    var bc = el("button","mini","📋 نسخ"); bc.onclick = function(){ copy(text); };
    var bs = el("button","mini","🗣️ نطق آلي"); bs.onclick = function(){ tts(text); };
    tools.appendChild(bc); tools.appendChild(bs);
    if (q.audio){
      var ba = el("button","mini","🔊 الصوت المرفوع");
      ba.onclick = function(){ playAudio(); };
      tools.appendChild(ba);
    }
    body.appendChild(tools);

    if (S.practice){
      var rv = el("button","reveal","👁️ اكشف الإجابة");
      rv.onclick = function(){ body.classList.remove("blurred"); rv.remove(); };
      body.appendChild(rv);
    }
    wrap.appendChild(body);

    if (q.draft){
      wrap.appendChild(el("div","draftbox","⚠️ دي إجابة مسودة — راجعها وعدّلها قبل الإنترفيو."));
    }

    /* ---- nav ---- */
    var idx = DB.questions.indexOf(q);
    var nav = el("div","navrow");
    var prev = el("button", null, "→ السؤال السابق");
    prev.disabled = idx<=0;
    prev.onclick = function(){ if(idx>0) selectQuestion(DB.questions[idx-1].id); };
    var next = el("button", null, "السؤال التالي ←");
    next.disabled = idx>=DB.questions.length-1;
    next.onclick = function(){ if(idx<DB.questions.length-1) selectQuestion(DB.questions[idx+1].id); };
    nav.appendChild(prev); nav.appendChild(next);
    wrap.appendChild(nav);

    loadAudioFor(q);
  }

  /* -------- player widget -------- */
  function buildPlayer(q){
    var p = el("div","player");

    var spk = el("button","speaker", q.audio ? "▶" : "🔇");
    spk.id = "spkBtn";
    spk.title = q.audio ? "تشغيل صوت الإجابة" : "ارفع صوت الإجابة";
    spk.onclick = function(){
      if (q.audio) playAudio();
      else { editingId = q.id; pendingAudio = null; openEditor(q.id, true); }
    };
    p.appendChild(spk);

    var meta = el("div","pl-meta");
    meta.appendChild(el("b", null, q.audio ? "صوت الإجابة" : "لا يوجد صوت بعد"));
    meta.appendChild(el("small", null, q.audio
      ? (q.audio.name + " · " + fmtSize(q.audio.size))
      : "ارفع ملف الصوت بصوت ألماني واضح"));
    var bar = el("div","bar"); var fill = el("i"); bar.appendChild(fill);
    meta.appendChild(bar);
    p.appendChild(meta);

    var ex = el("div","pl-extra");
    var up = el("button","mini", q.audio ? "تغيير" : "رفع صوت");
    up.onclick = function(){ editingId = q.id; pendingAudio = null; openEditor(q.id, true); };
    ex.appendChild(up);
    if (q.audio){
      var del = el("button","mini danger","حذف");
      del.onclick = function(){
        if (!confirm("تحذف صوت الإجابة؟")) return;
        audioEl.pause();
        A.del(q.id).then(function(){
          loadedFor = null;
          q.audio = null; save(); renderList(); renderAnswer(); toast("اتحذف");
        });
      };
      ex.appendChild(del);
    }
    p.appendChild(ex);

    setTimeout(function(){
      if (audioEl && audioEl.duration){
        fill.style.width = ((audioEl.currentTime/audioEl.duration)*100) + "%";
      }
    }, 30);

    return p;
  }

  function loadAudioFor(q, force){
    if (!force && loadedFor === q.id) return Promise.resolve(audioEl.src || null);
    loadedFor = q.id;
    if (audioURL){ URL.revokeObjectURL(audioURL); audioURL = null; }
    try { audioEl.pause(); } catch(e){}
    audioEl.removeAttribute("src");
    if (!q.audio) return Promise.resolve(null);
    return A.get(q.id).then(function(blob){
      if (blob){
        audioURL = URL.createObjectURL(blob);
        audioEl.src = audioURL;
        return audioURL;
      }
      if (q.audio.src){ audioEl.src = encodeURI(q.audio.src); return q.audio.src; }
      return null;
    }).catch(function(){
      if (q.audio && q.audio.src){ audioEl.src = encodeURI(q.audio.src); return q.audio.src; }
      return null;
    });
  }

  audioEl.addEventListener("timeupdate", function(){
    var f = document.querySelector(".player .bar > i");
    if (!f || !audioEl.duration) return;
    f.style.width = ((audioEl.currentTime/audioEl.duration)*100).toFixed(1) + "%";
  });
  audioEl.addEventListener("play", function(){
    var s = $("#spkBtn"); if (s){ s.textContent = "⏸"; s.classList.add("playing"); }
  });
  audioEl.addEventListener("pause", function(){
    var s = $("#spkBtn"); if (s){ s.textContent = "▶"; s.classList.remove("playing"); }
  });
  audioEl.addEventListener("ended", function(){
    var s = $("#spkBtn"); if (s){ s.textContent = "▶"; s.classList.remove("playing"); }
    var f = document.querySelector(".player .bar > i"); if (f) f.style.width = "0%";
  });

  function playAudio(){
    var q = currentQ();
    if (!q || !q.audio) return;
    if (!audioEl.src) {
      loadAudioFor(q, true).then(function(){
        if (audioEl.src) audioEl.play().catch(function(){ toast("اضغط تاني للتشغيل"); });
      });
      return;
    }
    if (audioEl.paused) audioEl.play().catch(function(){ toast("اضغط تاني للتشغيل"); });
    else { try { audioEl.pause(); } catch(e){} }
  }

  /* ============================================================
     EDITOR
     ============================================================ */
  function fillCats(sel){
    sel.innerHTML = "";
    CATS.forEach(function(c){
      var o = el("option", null, c.label); o.value = c.id; sel.appendChild(o);
    });
  }
  fillCats($("#f_cat"));

  function openEditor(id, focusAudio){
    editingId = id || null;
    var q = id ? DB.questions.filter(function(x){ return x.id===id; })[0] : null;
    $("#modalTitle").textContent = q ? "تعديل السؤال" : "سؤال جديد";
    $("#deleteBtn").classList.toggle("hidden", !q);

    $("#f_qar").value  = q ? (q.q_ar||"") : "";
    $("#f_qde").value  = q ? (q.q_de||"") : "";
    $("#f_kurz").value = q ? (q.kurz||"") : "";
    $("#f_lang").value = q ? (q.lang||"") : "";
    $("#f_ar").value   = q ? (q.ar||"")   : "";
    $("#f_cat").value  = q ? (q.cat||CATS[0].id) : CATS[0].id;
    $("#f_hot").checked   = q ? !!q.hot : false;
    $("#f_draft").checked = q ? !!q.draft : true;
    $("#audioName").textContent = q && q.audio
      ? (q.audio.name + " · " + fmtSize(q.audio.size))
      : "لا يوجد صوت — ارفع ملف MP3 / M4A / WAV";

    pendingAudio = null;
    showModal();
    setTimeout(function(){
      if (focusAudio) $("#pickAudio").focus();
      else $("#f_qar").focus();
    }, 60);
  }

  function showModal(){
    $("#overlay").classList.remove("hidden");
    $("#modal").classList.remove("hidden");
  }
  function hideModal(){
    $("#overlay").classList.add("hidden");
    $("#modal").classList.add("hidden");
  }
  $("#modalClose").onclick = hideModal;
  $("#cancelBtn").onclick = hideModal;
  $("#overlay").onclick = hideModal;

  $("#addBtn").onclick = function(){ openEditor(null); };
  $("#pickAudio").onclick = function(){ $("#audioInput").click(); };
  $("#audioInput").onchange = function(e){
    var f = e.target.files[0];
    if (!f) return;
    if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|wav|ogg|aac|webm)$/i.test(f.name)){
      toast("اختار ملف صوت"); return;
    }
    pendingAudio = f;
    $("#audioName").textContent = f.name + " · " + fmtSize(f.size) + " (لسه محفوظ)";
    e.target.value = "";
  };
  $("#testAudio").onclick = function(){
    if (pendingAudio){
      var u = URL.createObjectURL(pendingAudio);
      var a = new Audio(u); a.play(); a.onended = function(){ URL.revokeObjectURL(u); };
      return;
    }
    var q = editingId ? DB.questions.filter(function(x){ return x.id===editingId; })[0] : null;
    if (q && q.audio){ playAudio(); return; }
    toast("مفيش صوت مرفوع");
  };
  $("#removeAudio").onclick = function(){
    pendingAudio = null;
    var q = editingId ? DB.questions.filter(function(x){ return x.id===editingId; })[0] : null;
    if (q && q.audio){
      if (!confirm("تحذف الصوت المحفوظ؟")) return;
      q.audio = null; save(); A.del(q.id); loadedFor = null;
      renderList(); renderAnswer();
    }
    $("#audioName").textContent = "لا يوجد صوت — ارفع ملف MP3 / M4A / WAV";
    toast("اتحذف");
  };

  $("#saveBtn").onclick = function(){
    var qar = $("#f_qar").value.trim();
    var qde = $("#f_qde").value.trim();
    var kurz = $("#f_kurz").value.trim();
    if (!qar && !qde) return toast("اكتب اسم السؤال");
    if (!kurz) return toast("اكتب الإجابة المختصرة");

    var data = {
      q_ar: qar, q_de: qde, kurz: kurz,
      lang: $("#f_lang").value.trim(),
      ar:   $("#f_ar").value.trim(),
      cat:  $("#f_cat").value,
      hot:  $("#f_hot").checked,
      draft:$("#f_draft").checked
    };

    var q;
    if (editingId){
      q = DB.questions.filter(function(x){ return x.id===editingId; })[0];
      if (!q) return;
      Object.keys(data).forEach(function(k){ q[k] = data[k]; });
    } else {
      q = data;
      q.id = "q" + Date.now().toString(36);
      q.tags = [];
      q.audio = null;
      DB.questions.push(q);
      S.id = q.id;
    }

    var finish = function(){
      loadedFor = null;
      save(); hideModal(); renderList(); renderAnswer();
      toast("اتحفظ ✓");
    };

    if (pendingAudio){
      q.audio = { name: pendingAudio.name, size: pendingAudio.size, type: pendingAudio.type || "audio/mpeg" };
      A.put(q.id, pendingAudio).then(finish).catch(function(){
        q.audio = null; toast("الصوت كبير جدًا — جرّب ملف أصغر"); save(); hideModal(); renderList(); renderAnswer();
      });
    } else finish();
  };

  $("#deleteBtn").onclick = function(){
    if (!editingId) return;
    if (!confirm("تحذف السؤال ده نهائيًا؟")) return;
    A.del(editingId);
    DB.questions = DB.questions.filter(function(x){ return x.id !== editingId; });
    if (S.id === editingId) S.id = DB.questions[0] ? DB.questions[0].id : null;
    save(); hideModal(); renderList(); renderAnswer(); toast("اتحذف");
  };

  $("#moveUp").onclick = function(){ move(-1); };
  $("#moveDown").onclick = function(){ move(1); };
  function move(dir){
    if (!editingId) return;
    var i = DB.questions.map(function(x){ return x.id; }).indexOf(editingId);
    var j = i + dir;
    if (i<0 || j<0 || j>=DB.questions.length) return;
    var tmp = DB.questions[i]; DB.questions[i] = DB.questions[j]; DB.questions[j] = tmp;
    save(); renderList(); renderAnswer(); toast("اتحرك");
  }

  /* ============================================================
     PHRASES
     ============================================================ */
  var GROUPS = { voice:"الصوت والاتصال", time:"كسب وقت / تفكير", clarify:"توضيح السؤال", polite:"لباقة وختام" };
  $("#sosBtn").onclick = function(){
    var b = $("#pBody"); b.innerHTML = "";
    Object.keys(GROUPS).forEach(function(g){
      var list = DB.phrases.filter(function(p){ return p.cat===g; });
      if (!list.length) return;
      b.appendChild(el("div","pgroup", GROUPS[g]));
      list.forEach(function(p){
        var row = el("div","prow");
        var de = el("div","de", p.de); de.setAttribute("dir","ltr");
        de.onclick = function(){ tts(p.de); };
        row.appendChild(de);
        row.appendChild(el("div","ar", p.ar));
        var pr = el("div","pr");
        var c = el("button","mini","📋 نسخ"); c.onclick = function(){ copy(p.de); };
        var s = el("button","mini","🔊 اقرأ"); s.onclick = function(){ tts(p.de); };
        pr.appendChild(c); pr.appendChild(s);
        row.appendChild(pr);
        b.appendChild(row);
      });
    });
    $("#phrases").classList.remove("hidden");
    $("#pBody").scrollTop = 0;
  };
  $("#phBack").onclick = function(){ $("#phrases").classList.add("hidden"); };

  /* ============================================================
     BACKUP / RESTORE
     ============================================================ */
  $("#backupBtn").onclick = function(){
    var withAudio = confirm("تحب تضمّن ملفات الصوت في النسخة الاحتياطية؟\n(هتخلي الملف أكبر، لكن يبقى نسخة كاملة)");
    var out = { app:"Interview Copilot", v:3, exportedAt:new Date().toISOString(),
                questions: JSON.parse(JSON.stringify(DB.questions)), phrases: DB.phrases, meta: DB.meta,
                audio: {} };
    if (withAudio){
      var withA = DB.questions.filter(function(q){ return q.audio; });
      Promise.all(withA.map(function(q){
        return A.get(q.id).then(function(blob){
          if (!blob) return;
          return new Promise(function(res){
            var fr = new FileReader();
            fr.onload = function(){ out.audio[q.id] = { name:q.audio.name, type:q.audio.type, data:fr.result }; res(); };
            fr.readAsDataURL(blob);
          });
        }).catch(function(){});
      })).then(function(){ download(out); });
    } else download(out);

    function download(obj){
      var blob = new Blob([JSON.stringify(obj)], { type:"application/json" });
      var a = el("a");
      a.href = URL.createObjectURL(blob);
      a.download = "interview-copilot-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
      toast("النسخة اتنزلت ✓");
    }
  };

  $("#importBtn").onclick = function(){ $("#importInput").click(); };
  $("#importInput").onchange = function(e){
    var f = e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var d = JSON.parse(fr.result);
        if (!d || !d.questions) throw 0;
        if (!confirm("هيتم استبدال البيانات الحالية بـ " + d.questions.length + " سؤال. تكمل؟")) return;
        DB = { v:3, questions:d.questions, phrases:d.phrases||DB.phrases, meta:d.meta||DB.meta };
        DB.questions.forEach(function(q){ q.audio = q.audio || null; if(!q.tags) q.tags=[]; });
        save();
        var tasks = Object.keys(d.audio||{}).map(function(id){
          return fetch(d.audio[id].data).then(function(r){ return r.blob(); })
            .then(function(b){ return A.put(id, b); }).catch(function(){});
        });
        Promise.all(tasks).then(function(){
          loadedFor = null;
          S.id = DB.questions[0] ? DB.questions[0].id : null;
          renderFilters(); renderList(); renderAnswer();
          toast("اتحمّلت ✓");
        });
      }catch(err){ toast("الملف مش صالح"); }
    };
    fr.readAsText(f);
    e.target.value = "";
  };

  /* ============================================================
     PREF BTNS
     ============================================================ */
  $("#fontUp").onclick   = function(){ if (S.fs<28){ S.fs++; applyFs(); savePref(); } };
  $("#fontDown").onclick = function(){ if (S.fs>13){ S.fs--; applyFs(); savePref(); } };
  $("#practiceBtn").onclick = function(){
    S.practice = !S.practice; savePref();
    $("#practiceBtn").classList.toggle("on", S.practice);
    renderAnswer();
  };
  $("#practiceBtn").classList.toggle("on", S.practice);

  $("#search").addEventListener("input", function(e){
    S.q = e.target.value;
    renderList();
  });

  /* ============================================================
     KEYS
     ============================================================ */
  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName||"").toLowerCase();
    if (tag==="input"||tag==="textarea"||tag==="select"){
      if (e.key==="Escape") e.target.blur();
      return;
    }
    if (e.key==="/"){ e.preventDefault(); $("#search").focus(); }
    if (e.key==="Escape"){
      if (!$("#modal").classList.contains("hidden")) return hideModal();
      if (!$("#phrases").classList.contains("hidden")) return $("#phrases").classList.add("hidden");
      document.body.classList.remove("answering");
    }
    if (e.key==="ArrowDown" || e.key==="ArrowUp"){
      var idx = DB.questions.map(function(x){ return x.id; }).indexOf(S.id);
      if (idx<0) idx = 0;
      var n = e.key==="ArrowDown" ? Math.min(idx+1, DB.questions.length-1) : Math.max(idx-1, 0);
      if (DB.questions[n]) selectQuestion(DB.questions[n].id);
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  $("#sub").textContent = DB.questions.length + " سؤال · " + DB.phrases.length + " جملة إنقاذ";
  renderFilters();
  renderList();

  var firstId = null;
  try{ firstId = JSON.parse(localStorage.getItem(PREF) || "{}").last; }catch(e){}
  if (!firstId || !DB.questions.some(function(x){ return x.id === firstId; })){
    firstId = DB.questions[0] ? DB.questions[0].id : null;
  }
  if (firstId){
    selectQuestion(firstId);
    if (window.innerWidth <= 860) document.body.classList.remove("answering");
  } else {
    renderAnswer();
  }

  if ("speechSynthesis" in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
  }
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  window.addEventListener("beforeunload", function(){ if (audioURL) URL.revokeObjectURL(audioURL); });
})();
</script>
</body>
</html>
